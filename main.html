<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMDb Movie Page</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .movie-container {
            max-width: 900px;
            margin: auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .moviePic {
            height: 450px;
            width: 300px;
            opacity: 0.95;
            object-fit: cover;
            border-radius: 8px;
        }

        .movieTitle {
            font-size: 32px;
            margin: 20px 0 10px;
            color: #222;
        }

        .movieDetail {
            position: relative;
            top: 0;
            width: 80%;
            margin: 20px auto;
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
            color: #444;
        }

        .rating {
            font-size: 20px;
            font-weight: bold;
            color: #f5c518;
        }
    </style>
</head>

<body>

    <div class="movie-container">

        <img
            class="moviePic"
            src="https://m.media-amazon.com/images/M/MV5BMTM5NDM4MDg0OV5BMl5BanBnXkFtZTcwMDI2NTkzMw@@._V1_.jpg"
            alt="Movie Poster"
        >

        <h1 class="movieTitle">The Shawshank Redemption</h1>

        <div class="rating">IMDb ⭐ 9.3/10</div>

        <p class="movieDetail">
            Two imprisoned men bond over a number of years, finding solace
            and eventual redemption through acts of common decency.
        </p>

    </div>

</body>
</html>
